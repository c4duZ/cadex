# cargo-about: the licenses of every crate compiled into cadex-memory, written
# into the app at packaging (apps/macos/packaging/build.sh). The accepted list
# is upstream ai-memory's deny.toml (2026-11-15); a crate under any other
# license fails the package.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
