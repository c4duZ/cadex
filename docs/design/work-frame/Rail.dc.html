<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail and side column</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<!-- The rail (components.rail) and the side column's top and foot (components.inspector.iconTabs,
     scope, footer); docs/adr/0038-rail-and-side-column.md, plan 36. -->
<div style="display: flex; height: 640px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #E7E8EA">
  <div style="width: 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 0 8px; background: #121316; border-right: 1px solid #1F2125">
    <div style="position: relative; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #1A1C20; box-shadow: 0 0 0 3px #2E3238; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">B</div>
      <span style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #3FB97A; border: 2px solid #121316; box-sizing: border-box"></span>
      <span style="position: absolute; left: 21px; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: #9BA0A8"></span>
    </div>
    <div style="position: relative; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center">
      <!-- tokens:off: the project's own color, chosen by the owner (project.set-color) -->
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #B07CE8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">C</div>
      <!-- tokens:on -->
      <span style="position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: #F2A93B; border: 2px solid #121316; box-sizing: border-box"></span>
      <span style="position: absolute; left: 21px; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: #9BA0A8"></span>
    </div>
    <div style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #1A1C20; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">F</div>
    </div>
    <div style="width: 38px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #8A9099">+</div>
    <div style="flex: 1"></div>
    <div style="width: 28px; height: 1px; background: #2A2D33; margin: 3px 0"></div>
    <div style="width: 38px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #1F2226; color: #E7E8EA">▦</div>
    <div style="width: 38px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #8A9099">◷</div>
  </div>
  <div style="width: 260px; box-sizing: border-box; display: flex; flex-direction: column; background: #131417; border-right: 1px solid #1F2125">
    <div style="display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid #1F2125">
      <span style="width: 40px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #1F2226; color: #E7E8EA">▤</span>
      <span style="width: 40px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8A9099">±</span>
      <span style="width: 40px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8A9099">◎</span>
      <span style="width: 40px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #8A9099">⑂</span>
    </div>
    <div style="flex: 1; padding: 4px 6px; color: #9BA0A8; font-size: 12.5px">The page: Files, Changes, Memory or Git graph.</div>
    <div style="display: flex; align-items: center; gap: 2px; padding: 10px 8px 4px 14px; border-top: 1px solid #1F2125; font-size: 11.5px; color: #8A9099">
      <span style="flex: 1">bkdg-center · dev/center</span>
      <span style="width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #7C828B">↓</span>
      <span style="width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #7C828B">↑</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
