<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Memory health</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<!-- Plan 40 G: the server's health (print 07), read-only, one box per section. -->
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0F; color: #E7E8EA; font-family: Inter, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden; border: 1px solid #25282D">
  <dc-import name="TitleBar" view="memory" panel="{{ false }}" hint-size="1440px,44px"></dc-import>

  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="MemorySidebar" section="health" hint-size="448px,826px"></dc-import>

    <div style="flex: 1; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Saúde do servidor</span>
        <span style="color: #8A9099">Somente leitura: cada correção é um comando</span>
      </div>

      <div style="padding: 10px 14px; border-radius: 10px; background: #1C1812; border: 1px solid #4A3A1C; color: #F2D29B">Contadores de hooks, spool e provedores não ligados a este painel</div>
      <div style="display: flex; align-items: center; gap: 8px; color: #6FCF97"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3FB97A"></span>Todas as verificações do servidor passaram</div>

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start">
        <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <sc-for list="{{col}}" as="g" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B">{{g.title}}</span>
                <div style="padding: 0 14px; border-radius: 10px; background: #131417; border: 1px solid #1F2125">
                  <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
                    <div style="{{r.style}}">
                      <span style="width: 150px; flex: none; color: #D5D7DB">{{r.name}}</span>
                      <span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 1.5; color: #9BA0A8">{{r.value}}</span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <dc-import name="StatusBar" hint-size="1440px,30px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (first) => 'display: flex; align-items: baseline; gap: 12px; padding: 8px 0; font-size: 12.5px; ' + (first ? 'border-top: 0' : 'border-top: 1px solid #1F2125');
    const group = (title, pairs) => ({ title, rows: pairs.map(([name, value], i) => ({ name, value, style: row(i === 0) })) });
    return {
      columns: [
        [
          group('HOOKS (DESDE O INÍCIO DO SERVIDOR)', [
            ['aceitos', '0'],
            ['rejeitados (429)', '0 (0 por saturação, 0 por limite de taxa)'],
            ['resultados', '0 armazenados, 0 reproduzidos, 0 retomados, 0 encerramentos ignorados, 0 falhas'],
            ['descartados', '0 pela política de captura, 0 não autorizados, 0 colisões, 0 inválidos'],
            ['última gravação', 'nunca'],
          ]),
          group('GRAVAÇÃO, SPOOL E RECUPERAÇÃO', [
            ['fila de gravação', 'desconhecido'],
            ['spool de hooks', 'não visível para este servidor'],
            ['registro de recuperação', 'não visível para este servidor'],
          ]),
          group('CONSOLIDAÇÃO', [
            ['última conclusão', 'nunca'],
            ['fila', '0 pendentes, 0 em execução, 0 concluídas, 0 com falha'],
            ['pendente mais antigo', 'nunca'],
          ]),
        ],
        [
          group('EMBEDDINGS E MODELOS', [
            ['gerador de embeddings', 'nenhum (somente FTS5 + entidades + grafo)'],
            ['provedor de embeddings', 'desabilitado'],
            ['provedor LLM', 'desabilitado'],
            ['reclassificador', 'off'],
            ['vetores', '200 registros; 0 páginas mais recentes sem embedding; 0 sem embedding possível'],
            ['identidade armazenada', 'local/all-MiniLM-L6-v2 dimensão 384: 200 registros'],
          ]),
          group('ÍNDICE E ARMAZENAMENTO', [
            ['fts', 'páginas 200/200; observações 86023/86023'],
            ['banco de dados', '231460864 bytes, 245760 recuperáveis'],
          ]),
        ],
      ],
    };
  }
}
</script>
</body>
</html>
