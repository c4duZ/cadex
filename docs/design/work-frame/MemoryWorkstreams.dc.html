<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Memory workstreams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<!-- Plan 40 F: the managed workstreams across projects (print 03). -->
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0F; color: #E7E8EA; font-family: Inter, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden; border: 1px solid #25282D">
  <dc-import name="TitleBar" view="memory" panel="{{ false }}" hint-size="1440px,44px"></dc-import>

  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="MemorySidebar" section="workstreams" hint-size="448px,826px"></dc-import>

    <div style="flex: 1; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Workstreams gerenciados</span>
          <span style="color: #8A9099">Por atenção e atividade recente</span>
        </div>
        <span style="font-size: 12px; color: #7C828B">Página 1</span>
      </div>

      <div style="display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) 140px minmax(0, 1.2fr) 160px 90px; align-items: center; column-gap: 12px; padding: 8px 12px; border-bottom: 1px solid #1F2125; font-size: 11px; font-weight: 600; color: #7C828B">
          <span>Workstream</span><span>Estado</span><span>Execução mais recente</span><span>Evidências</span><span style="text-align: right">Atividade</span>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) 140px minmax(0, 1.2fr) 160px 90px; align-items: start; column-gap: 12px; padding: 10px 12px; border-bottom: 1px solid #1F2125; font-size: 12.5px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">default</span><span style="font-size: 11.5px; color: #8A9099"><span style="color: #9BC1FF">bkdg-center</span> · <span style="font-family: 'JetBrains Mono', ui-monospace, monospace">44cb9ea7</span></span></span>
          <span><span style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: #2A2113; color: #F2B65E"><span style="width: 6px; height: 6px; border-radius: 50%; background: #F2A93B"></span>interrompido</span></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; align-items: center; gap: 8px"><span style="padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: #1D1F23; color: #9BA0A8">claude-code</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9BA0A8">b97d3484</span></span><span style="font-size: 11.5px; color: #8A9099">Início há 1 dia</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px"><span>0 evento</span><span style="padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: #1D1F23; color: #9BA0A8">claude-code</span></span>
          <span style="text-align: right; color: #8A9099">há 1 dia</span>
        </div>
      </div>
    </div>
  </div>

  <dc-import name="StatusBar" hint-size="1440px,30px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
