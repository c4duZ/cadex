<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #E7E8EA">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; left: 293px; right: 321px; bottom: 31px; height: 340px; background: #101113; border-top: 1px solid #2C3036; box-shadow: 0 -16px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column">
    <div style="height: 38px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid #1F2125">
      <div style="height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 7px; background: #1D1F23; font-weight: 500; font-size: 12.5px">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5 6 8l-3.5 3.5M8 11.5h5"></path></svg>zsh <span style="color: #7C828B">~/Cadu/Trabalho</span>
      </div>
      <div style="height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 7px; color: #9BA0A8; font-size: 12.5px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #3FB97A"></span>ssh pc
      </div>
      <div style="height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 7px; color: #9BA0A8; font-size: 12.5px">htop</div>
      <button aria-label="New shell" style="width: 28px; height: 28px; border: 0; background: transparent; color: #7C828B; font-size: 16px; line-height: 1">+</button>
      <span style="flex: 1"></span>
      <span style="font-size: 11.5px; color: #7C828B">⌃` show or hide · drag up to resize · ⌘↩ move to a task</span>
    </div>
    <div style="flex: 1; padding: 12px 16px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; color: #C9CCD1">
      <div><span style="color: #6FCF97">~/Cadu/Trabalho</span> <span style="color: #7C828B">❯</span> brew upgrade gh</div>
      <div style="color: #8A9099">==&gt; Upgrading 1 outdated package:</div>
      <div style="color: #8A9099">gh 2.81.0 -&gt; 2.83.1</div>
      <div><span style="color: #6FCF97">~/Cadu/Trabalho</span> <span style="color: #7C828B">❯</span> df -h /</div>
      <div style="color: #8A9099">/dev/disk3s1s1   228Gi    13Gi    13Gi    50%</div>
      <div><span style="color: #6FCF97">~/Cadu/Trabalho</span> <span style="color: #7C828B">❯</span> <span style="display: inline-block; width: 7px; height: 14px; background: #C9CCD1; vertical-align: middle"></span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
