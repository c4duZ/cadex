<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Memory learning review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<!-- Plan 40 G: the learning review, "Gravações pendentes" (print 06), empty as in the owner's data. -->
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0F; color: #E7E8EA; font-family: Inter, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden; border: 1px solid #25282D">
  <dc-import name="TitleBar" view="memory" panel="{{ false }}" hint-size="1440px,44px"></dc-import>

  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="MemorySidebar" section="review" hint-size="448px,826px"></dc-import>

    <div style="flex: 1; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Gravações pendentes</span>
        <span style="color: #8A9099">Propostas de melhoria automática à espera de decisão</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 12px; color: #8A9099">Projeto</span>
        <span style="height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 7px; background: #1A1C20; border: 1px solid #2A2D33; font-size: 12.5px">Todos os projetos (0) <span style="font-size: 11px; color: #9BA0A8">▾</span></span>
        <span style="font-size: 12px; color: #8A9099; margin-left: 12px">Ordenação</span>
        <span style="height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 7px; background: #1A1C20; border: 1px solid #2A2D33; font-size: 12.5px">Projeto e depois data de envio <span style="font-size: 11px; color: #9BA0A8">▾</span></span>
        <span style="flex: 1"></span>
        <span style="font-size: 12px; color: #8A9099">0 exibidas · 0 pendentes em 0 projeto</span>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid #1F2125">
        <span style="font-size: 15px; font-weight: 600">Nenhuma proposta pendente</span>
      </div>
    </div>
  </div>

  <dc-import name="StatusBar" hint-size="1440px,30px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
