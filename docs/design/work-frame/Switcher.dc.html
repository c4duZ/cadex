<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jump switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #E7E8EA">
  <dc-import name="Main" hint-size="1440px,900px"></dc-import>
  <div style="position: absolute; inset: 0; border-radius: 12px; background: rgba(5,6,7,0.6)"></div>
  <div style="position: absolute; top: 120px; left: 420px; width: 600px; border-radius: 14px; background: #17191C; border: 1px solid #2C3036; box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden">
    <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #24272C">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#8A9099" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
      <label style="flex: 1; display: flex">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Jump to a task</span>
        <input placeholder="Jump to a task, or type to start one" style="flex: 1; border: 0; outline: 0; background: transparent; color: #E7E8EA; font: inherit; font-size: 15px">
      </label>
      <span style="font-size: 11px; color: #7C828B">⌘J</span>
    </div>
    <div style="padding: 6px">
      <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
        <div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B">{{group.title}}</div>
        <sc-for list="{{group.rows}}" as="row" hint-placeholder-count="2">
          <div style="{{row.box}}">
            <span style="{{group.glyph}}"></span>
            <span style="font-weight: 600">{{row.name}}</span>
            <span style="color: #8A9099; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.detail}}</span>
            <span style="font-size: 11px; color: #7C828B; padding: 1px 6px; border-radius: 5px; border: 1px solid #2A2D33">{{row.key}}</span>
          </div>
        </sc-for>
      </sc-for>
      <div style="margin-top: 6px; border-top: 1px solid #24272C; padding-top: 6px">
        <div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; color: #C9CCD1">
          <span style="width: 18px; text-align: center; font-size: 16px; color: #9BA0A8">+</span>
          <span style="flex: 1">New task in <b style="font-weight: 600">cadex</b>…</span>
          <span style="font-size: 11px; color: #7C828B">⌘N</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; flex: none; ';
    let n = 0;
    const rows = (list) => list.map((r) => {
      n += 1;
      return { ...r, key: '⌘' + n, box: 'height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; ' + (n === 1 ? 'background: #23262B' : '') };
    });
    return {
      groups: [
        { title: 'NEEDS YOU', glyph: base + 'background: #F2A93B; box-shadow: 0 0 0 3px rgba(242,169,59,0.18)', rows: rows([
          { name: 'perf-subagent-window', detail: 'cadex · approve Bash' },
          { name: 'checkout-copy', detail: 'bhband-site · a question' },
        ]) },
        { title: 'FINISHED', glyph: base + 'background: #3FB97A', rows: rows([
          { name: 'bell-cards', detail: 'cadex · PR #41' },
        ]) },
        { title: 'WORKING', glyph: base + 'border: 2px solid #5B9CF5; border-top-color: transparent', rows: rows([
          { name: 'orchestration-e', detail: 'cadex · wiring the wake check' },
          { name: 'kite-1', detail: 'cadex · race kite #1' },
          { name: 'kite-2', detail: 'cadex · race kite #2' },
        ]) },
      ],
    };
  }
}
</script>
</body>
</html>
