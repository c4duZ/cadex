<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0F; color: #E7E8EA; font-family: Inter, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden; border: 1px solid #25282D">
  <dc-import name="TitleBar" view="board" panel="{{ false }}" hint-size="1440px,44px"></dc-import>
  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="Sidebar" selected="" hint-size="292px,826px"></dc-import>

    <div style="flex: 1; min-width: 0; display: flex; justify-content: center; overflow: hidden">
      <div style="width: 760px; padding-top: 72px; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Good evening</span>
          <span style="color: #8A9099">Pick up where you were, or start something.</span>
        </div>

        <div style="border-radius: 14px; background: #131417; border: 1px solid #2A2D33; box-shadow: 0 0 0 3px rgba(91,156,245,0.08); overflow: hidden">
          <div style="padding: 16px 18px 12px; color: #8A9099; font-size: 14px">What do you want to do in <span style="color: #E7E8EA; font-weight: 600">cadex</span>?<span style="display: inline-block; width: 2px; height: 16px; background: #E7E8EA; vertical-align: middle; margin-left: 4px"></span></div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #1F2125">
            <span style="padding: 5px 10px; border-radius: 7px; background: #1D1F23; font-size: 12px">◆ Claude · bkdg ▾</span>
            <span style="padding: 5px 10px; border-radius: 7px; background: #1D1F23; font-size: 12px">In this folder ▾</span>
            <span style="flex: 1"></span>
            <span style="font-size: 11.5px; color: #7C828B">↩ opens a terminal with Claude</span>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
            <div style="padding: 14px; border-radius: 12px; background: #131417; border: 1px solid #1F2125; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px">{{a.icon}}</span><span style="font-weight: 600">{{a.title}}</span></div>
              <span style="font-size: 12px; line-height: 1.45; color: #8A9099">{{a.text}}</span>
              <span style="font-size: 11px; color: #7C828B">{{a.key}}</span>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B"><span style="flex: 1">RECENT PROJECTS</span><span style="letter-spacing: 0; font-weight: 500">Open folder ⌘O · Clone…</span></div>
          <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; background: #131417; border: 1px solid #1F2125">
              <span style="font-weight: 600; width: 130px">{{p.name}}</span>
              <span style="flex: 1; color: #8A9099; font-size: 12px">{{p.path}}</span>
              <span style="font-size: 12px; color: {{p.color}}">{{p.state}}</span>
              <span style="font-size: 11.5px; color: #7C828B; width: 70px; text-align: right">{{p.when}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
  <dc-import name="StatusBar" hint-size="1440px,30px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      actions: [
        { icon: '›_', title: 'Terminal', text: 'A shell in the project’s folder. Nothing else.', key: '⌘T' },
        { icon: '◆', title: 'Agent', text: 'A terminal already running Claude or Codex, in the account you pick.', key: '⌘⇧A' },
        { icon: '⑂', title: 'Task', text: 'A separate copy on a new branch, so it works in parallel with you.', key: '⌘N' },
        { icon: '⚑', title: 'Race', text: 'The same task given to 2–3 agents; you keep the best.', key: '⌘N, then + agent' },
      ],
      projects: [
        { name: 'cadex', path: '~/Cadu/Trabalho/cadu/cadex', state: '2 terminals open · 1 needs you', color: '#F2B65E', when: 'now' },
        { name: 'bhband-site', path: '~/Cadu/Trabalho/bhband-site', state: 'Claude finished', color: '#6FCF97', when: '1h' },
        { name: 'portfolio', path: '~/Cadu/Trabalho/portfolio', state: 'nothing open', color: '#7C828B', when: '3d' },
      ],
    };
  }
}
</script>
</body>
</html>
