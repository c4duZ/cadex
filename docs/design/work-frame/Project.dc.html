<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A project's page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090A}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #0C0D0F; color: #E7E8EA; font-family: Inter, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden; border: 1px solid #25282D">
  <dc-import name="TitleBar" view="project" panel="{{ true }}" hint-size="1440px,44px"></dc-import>

  <div style="flex: 1; display: flex; min-height: 0">
    <dc-import name="Sidebar" selected="" project="cadex" hint-size="292px,826px"></dc-import>

    <div style="flex: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; gap: 16px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">cadex</span>
          <span style="color: #8A9099">~/Cadu/Trabalho/cadu/cadex · main ↑3 · github.com/c4duZ/cadex</span>
        </div>
        <button style="height: 32px; padding: 0 14px; border-radius: 7px; border: 1px solid #2A2D33; background: #1A1C20; color: #E7E8EA; font: inherit; font-weight: 500">Race…</button>
        <button style="height: 32px; padding: 0 14px; border-radius: 7px; border: 0; background: #E7E8EA; color: #111214; font: inherit; font-weight: 600">New task  ⌘N</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="padding: 14px 16px; border-radius: 10px; background: #131417; border: 1px solid #1F2125; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; color: #8A9099">{{s.label}}</span>
            <span style="font-size: 20px; font-weight: 650">{{s.value}}</span>
            <span style="font-size: 11.5px; color: #7C828B">{{s.note}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; min-height: 0; flex: 1">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B">RECENT CONVERSATIONS</div>
          <sc-for list="{{conversations}}" as="c" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: #131417; border: 1px solid #1F2125">
              <span style="{{c.dot}}"></span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
                <span style="font-size: 11.5px; color: #8A9099">{{c.meta}}</span>
              </div>
              <span style="font-size: 11.5px; color: #7C828B">{{c.when}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B">AUTOMATIONS</div>
          <sc-for list="{{automations}}" as="a" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: #131417; border: 1px solid #1F2125">
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600">{{a.name}}</span>
                <span style="font-size: 11.5px; color: #8A9099">{{a.when}}</span>
              </div>
              <span style="{{a.toggle}}"><span style="{{a.knob}}"></span></span>
            </div>
          </sc-for>
          <div style="margin-top: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #7C828B">ACCOUNTS USED HERE</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <span style="padding: 6px 10px; border-radius: 8px; background: #131417; border: 1px solid #1F2125">Claude bkdg <span style="color: #F2B65E">84%</span></span>
            <span style="padding: 6px 10px; border-radius: 8px; background: #131417; border: 1px solid #1F2125">Claude bhband <span style="color: #8A9099">31%</span></span>
            <span style="padding: 6px 10px; border-radius: 8px; background: #131417; border: 1px solid #1F2125">Codex pro <span style="color: #8A9099">12%</span></span>
          </div>
        </div>
      </div>
    </div>

    <dc-import name="Inspector" tab="memory" hint-size="320px,826px"></dc-import>
  </div>

  <dc-import name="StatusBar" hint-size="1440px,30px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c, ring) => 'width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; flex: none; ' + (ring ? 'border: 2px solid #5B9CF5; border-top-color: transparent' : 'background: ' + c);
    const toggle = (on) => 'position: relative; width: 30px; height: 18px; border-radius: 9px; flex: none; background: ' + (on ? '#3FB97A' : '#2A2D33');
    const knob = (on) => 'position: absolute; top: 2px; ' + (on ? 'right' : 'left') + ': 2px; width: 14px; height: 14px; border-radius: 50%; background: #F4F5F6';
    return {
      stats: [
        { label: 'Tasks open', value: '4', note: '1 working · 1 needs you' },
        { label: 'This week', value: 'US$ 6.40', note: '23 sessions · 3 accounts' },
        { label: 'Merged', value: '11 PRs', note: 'last: bell-cards, 22m' },
        { label: 'Memory', value: '214 pages', note: '+3 today' },
      ],
      conversations: [
        { title: 'Add the wake check to the agenda', meta: 'orchestration-e · Claude Opus · bkdg', when: 'now', dot: dot('', true) },
        { title: 'Why does make perf go over the limit?', meta: 'perf-subagent-window · Claude · bhband', when: '1h', dot: dot('#F2A93B') },
        { title: 'The bell’s cards show only their button', meta: 'bell-cards · Codex · pro', when: '3h', dot: dot('#3FB97A') },
        { title: 'Plan 24 phase E: automations', meta: 'main · Claude Opus · bkdg', when: 'yesterday', dot: dot('#3FB97A') },
        { title: 'Windows: tabs in Win32', meta: 'windows-port-tabs · Claude · bkdg', when: '2d', dot: dot('#6B7079') },
      ],
      automations: [
        { name: 'Nightly make check', when: 'every day 03:00 · last ok', toggle: toggle(true), knob: knob(true) },
        { name: 'Weekly dependency review', when: 'Mondays 09:00 · next in 6 d', toggle: toggle(true), knob: knob(true) },
        { name: 'Tidy the memory', when: 'off', toggle: toggle(false), knob: knob(false) },
      ],
    };
  }
}
</script>
</body>
</html>
